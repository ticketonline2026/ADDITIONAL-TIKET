<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Additional Ticket</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f8ff;
padding:20px;
padding-bottom:120px;
}

/* ===== TITLE ===== */

.section-title{
font-size:28px;
font-weight:800;
margin-bottom:20px;
color:#0f4c81;
}

/* ===== TICKET CARD ===== */

.ticket-card{
position:relative;
background:#fff;
border-radius:30px;
overflow:hidden;
padding:24px;
margin-bottom:25px;
box-shadow:0 12px 30px rgba(0,0,0,.08);
border:1px solid #dbeafe;
}

/* STRIP ATAS */

.ticket-card::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:8px;
background:linear-gradient(
90deg,
#00aaff,
#00d9ff
);
}

/* LUBANG TIKET */

.ticket-card::before{
content:"";
position:absolute;
left:-22px;
top:65%;
width:44px;
height:44px;
background:#f3f8ff;
border-radius:50%;
box-shadow:
calc(100vw) 0 0 #f3f8ff;
}

/* BADGE */

.sale{
display:inline-block;
background:#dff4ff;
color:#0095ff;
padding:8px 14px;
border-radius:12px;
font-size:13px;
font-weight:700;
}

.stock{
position:absolute;
right:20px;
top:20px;
background:#fff5db;
color:#ff8a00;
padding:8px 14px;
border-radius:999px;
font-size:12px;
font-weight:bold;
}

/* TITLE */

.ticket-name{
font-size:24px;
font-weight:800;
margin-top:15px;
margin-bottom:15px;
color:#111;
}

/* DESC */

.ticket-info{
line-height:1.9;
font-size:14px;
color:#555;
}

/* SOBEKAN */

.divider{
position:relative;
margin:24px 0;
border-top:2px dashed #b9dcff;
}

.divider::before{
content:"";
position:absolute;
left:-36px;
top:-22px;
width:44px;
height:44px;
background:#f3f8ff;
border-radius:50%;
}

.divider::after{
content:"";
position:absolute;
right:-36px;
top:-22px;
width:44px;
height:44px;
background:#f3f8ff;
border-radius:50%;
}

/* BOTTOM */

.ticket-bottom{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.price{
font-size:30px;
font-weight:800;
color:#00aaff;
}

/* BUTTON */

.select-btn{
background:#00aaff;
color:white;
border:none;
padding:13px 20px;
border-radius:14px;
font-weight:700;
cursor:pointer;
}

/* QTY */

.qty-box{
display:none;
align-items:center;
gap:10px;
}

.qty-btn{
width:40px;
height:40px;
border:none;
border-radius:12px;
background:#00aaff;
color:white;
font-size:22px;
cursor:pointer;
}

.qty-number{
min-width:45px;
text-align:center;
font-size:22px;
font-weight:800;
}

/* CHECKOUT */

.checkout{
position:fixed;
left:0;
right:0;
bottom:0;
background:white;
padding:15px;
box-shadow:0 -8px 25px rgba(0,0,0,.08);
z-index:999;
}

.checkout-wrap{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.total{
font-size:24px;
font-weight:800;
color:#00aaff;
}

.buy-btn{
background:#00aaff;
color:white;
border:none;
padding:16px 25px;
border-radius:15px;
font-weight:800;
cursor:pointer;
}

.buy-btn:disabled{
background:#c7d7e7;
cursor:not-allowed;
}

/* MOBILE */

@media(max-width:768px){

.ticket-bottom{
flex-direction:column;
align-items:flex-start;
}

.price{
font-size:26px;
}

.checkout-wrap{
flex-direction:column;
}

.buy-btn{
width:100%;
}

}

</style>
</head>
<body>

<div class="section-title">
🎫 ADDITIONAL TICKET
</div>

<!-- CARD 1 -->

<div class="ticket-card">

<div class="sale">ON SALE</div>

<div class="stock">
🔥 TERSISA 15 TIKET
</div>

<div class="ticket-name">
EXTRA SALE FESTIVAL
</div>

<div class="ticket-info">

• Jam masuk dibebaskan maksimal sebelum 20.00 WIB.<br>
• Pembelian 1–10 tiket.<br>
• Data peserta dapat dibedakan atau disamakan.<br>
• Semua kategori adalah Festival Standing.<br>
• Anak dibawah 7 tahun tidak dikenakan biaya tiket.<br>

</div>

<div class="divider"></div>

<div class="ticket-bottom">

<div class="price">
Rp150.000
</div>

<button class="select-btn"
id="btn1"
onclick="showQty()">
Pilih Tiket
</button>

<div class="qty-box" id="qtyBox">

<button class="qty-btn"
onclick="minusQty()">
−
</button>

<div class="qty-number"
id="qty">
1
</div>

<button class="qty-btn"
onclick="plusQty()">
+
</button>

</div>

</div>

</div>

<!-- CHECKOUT -->

<div class="checkout">

<div class="checkout-wrap">

<div class="total"
id="total">
Rp0
</div>

<button
class="buy-btn"
id="buyBtn"
disabled>
BELI TIKET
</button>

</div>

</div>

<script>

const PRICE=150000;

let qty=0;

function showQty(){

document.getElementById('btn1').style.display='none';

document.getElementById('qtyBox').style.display='flex';

qty=1;

updateTotal();

}

function plusQty(){

qty++;

updateTotal();

}

function minusQty(){

if(qty>1){

qty--;

updateTotal();

}

}

function updateTotal(){

document.getElementById('qty').innerText=qty;

let total=qty*PRICE;

document.getElementById('total').innerText=
'Rp'+total.toLocaleString('id-ID');

document.getElementById('buyBtn').disabled=
total<=0;

}

document.getElementById('buyBtn')
.addEventListener('click',function(){

alert(
'Total Pembayaran : Rp'+
(qty*PRICE).toLocaleString('id-ID')
);

});

</script>

</body>
</html>
